# NOTE: the Claude GitHub App runs only workflow files identical to the
# default branch. This workflow is skipped, with a green check, on any PR
# that changes it. It first runs on the next PR after such a change merges.
#
# PR review agent (DESIGN.md §12): checks every pull request against
# DESIGN.md §6, §8 and §11 and posts one findings comment citing the
# sections it applies. Uses inline comments only for line-specific issues.
# Never edits files.
# PRs are expected to come from branches of this repository. A PR from a fork gets no
# secrets, so the review does not run for it.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --max-turns 40
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the review agent for this repository. DESIGN.md at the repo root is the governing design; CLAUDE.md holds repository rules. The PR branch is checked out in the working directory.

            Steps:
            1. Read DESIGN.md sections 6, 8, 11 and 12, and CLAUDE.md.
            2. Run `gh pr view --json title,body` and `gh pr diff` for this PR.
            3. Review the diff against those sections. Every finding must cite the section it applies, for example "§11 controller-runtime boundary".

            Check specifically:
            - Any import of sigs.k8s.io/controller-runtime in the root module outside targets/toy-widget/ and pkg/cluster; the separate modules under docs/spikes/ are exempt (§11).
            - A README fenced block preceded by `<!-- embed: <path> -->` whose content differs from that file (§11).
            - The PR description names the milestone and the invariant/property IDs it touches, and has a "Design change" section if DESIGN.md changed (§11).
            - Any change to an invariant's meaning that is not accompanied by an edit to §6 in the same PR (§12).
            - New behaviour arrives with tests, and envtest tests carry the `envtest` build tag (§11 test tiers). Flaky-test retries are never acceptable (§11).
            - Code and documents that contradict DESIGN.md without saying which one is wrong.

            Classify each finding as BLOCKING or non-blocking. Post exactly one top-level comment with `gh pr comment`. Its first line must be exactly `🤖 Created by Claude 🤖` (rule in CLAUDE.md). Then a heading `## Review against DESIGN.md`, the findings as a list with their section citations, the sections you checked, and a final line that is exactly `Verdict: APPROVE` or `Verdict: BLOCK` (BLOCK if any finding is BLOCKING). Use inline comments only for line-specific issues, and prefix each with `🤖 Created by Claude 🤖` as well. If there are no findings, say so, list the sections you checked, and end with `Verdict: APPROVE`. Do not post anything else and do not edit files.
