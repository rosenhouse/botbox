# The nightly tier of DESIGN.md §10 (M5, M7): each adopted example on seeds
# botbox draws for itself, and the kind tier of §11. It is separate from CI so
# that a find never blocks a merge, and it keeps the failing run's evidence.
name: Nightly

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

# cert-manager binds a fixed healthz port (DESIGN.md §15, D28), so a dispatch
# waits for the scheduled run rather than racing it.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  # A find is reported as an issue, since nobody watches a red badge.
  issues: write

jobs:
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One example finding something must not cancel the other.
      fail-fast: false
      matrix:
        include:
          - example: cert-manager
            binary: cert-manager-controller
            tier: test-example-nightly
          - example: external-secrets
            binary: external-secrets
            tier: test-example-external-secrets-nightly
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache envtest control-plane binaries
        uses: actions/cache@v4
        with:
          path: |
            bin/envtest
            bin/setup-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - name: Read the ${{ matrix.example }} pin
        id: pin
        run: echo "version=$(make --no-print-directory ${{ matrix.example }}-version)" >>"$GITHUB_OUTPUT"
      - name: Cache the ${{ matrix.example }} controller
        uses: actions/cache@v4
        with:
          path: |
            bin/${{ matrix.binary }}
            bin/${{ matrix.example }}-${{ steps.pin.outputs.version }}.built
          key: ${{ matrix.example }}-${{ runner.os }}-${{ steps.pin.outputs.version }}
      - name: The ${{ matrix.example }} example on drawn seeds
        id: example
        run: make ${{ matrix.tier }}
      # A find is only actionable with the run it came from (§5.7, §11).
      - name: Keep the failing run's evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: botbox-out-${{ matrix.example }}
          path: botbox-out/
          if-no-files-found: ignore

      # Only the tier failing is a find. A checkout or a cache that fell over is
      # not, and an issue claiming a seed to replay would be false.
      #
      # One open issue per example carries that example's finds, so a run that
      # keeps failing comments rather than filing again, and the two legs of the
      # matrix never race to file one issue between them. The label is the key:
      # `in:title` searches a full-text index, which can miss and then file a
      # duplicate every night.
      - name: Report the find
        if: steps.example.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXAMPLE: ${{ matrix.example }}
          TITLE: 'Nightly: the ${{ matrix.example }} example found something'
          LABEL: nightly-find-${{ matrix.example }}
          TIER: ${{ matrix.tier }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(cat <<EOF
          🤖 Created by Claude 🤖

          The nightly run of \`make $TIER\` failed on $(date -u +%Y-%m-%d).
          It draws its own seeds, so the run log names the seed that found this and
          \`botbox replay\` reproduces it.

          - The run, and the failing sequence's evidence as the \`botbox-out-$EXAMPLE\` artifact: $RUN_URL

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          )
          gh label create "$LABEL" --description "A find from the nightly $EXAMPLE run" --color B60205 --force
          open=$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$body"
          fi

  # The kind tier of DESIGN.md §11: the toy through --kubeconfig against a real
  # cluster, whose controller manager envtest lacks.
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: The toy against kind
        id: kind
        run: make test-kind
      - name: Keep the failing run's evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: botbox-out-kind
          path: botbox-out/
          if-no-files-found: ignore
      - name: Report the find
        if: steps.kind.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'Nightly: the kind tier failed'
          LABEL: nightly-find-kind
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(cat <<EOF
          🤖 Created by Claude 🤖

          The nightly run of \`make test-kind\` failed on $(date -u +%Y-%m-%d).
          Its seeds are fixed, so the run log names the sequence and the seed, and
          \`botbox replay\` reproduces it against a kind cluster.

          - The run, and the failing run's evidence as the \`botbox-out-kind\` artifact: $RUN_URL

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          )
          gh label create "$LABEL" --description "A failure of the nightly kind tier" --color B60205 --force
          open=$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$body"
          fi
