# The toy's CRD and sample, managing every kind whose status envtest never
# changes, and two kinds whose status it does. Nothing launches this target.
name: toy-widget
crds:
  - ../../../../targets/toy-widget/crds/
primary: toy.botbox/v1/Widget
sample: ../../../../targets/toy-widget/widget.yaml
manages:
  - v1/ConfigMap
  - apps/v1/Deployment
  - apps/v1/StatefulSet
  - apps/v1/DaemonSet
  - apps/v1/ReplicaSet
  - batch/v1/Job
  - batch/v1/CronJob
  - v1/ReplicationController
  - v1/Pod
  - v1/PersistentVolumeClaim
  - example.com/v1/Deployment
launch:
  binary: bin/none
