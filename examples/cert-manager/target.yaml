# cert-manager as a black-box target (DESIGN.md §8.1). Nothing here is patched
# into cert-manager: the CRDs are its release asset and the binary is its own
# cmd/controller, both at the version the Makefile pins.
name: cert-manager
version: v1.21.2
crds:
  - crds/cert-manager.crds.yaml
primary: cert-manager.io/v1/Certificate
sample: certificate.yaml
fixtures:
  - issuer.yaml
manages:
  - v1/Secret
  - cert-manager.io/v1/CertificateRequest
# A Certificate carries observedGeneration inside each condition, not at the
# top level, so readiness is a cross-field comparison (DESIGN.md §8.4).
ready: >-
  has(status.conditions) && status.conditions.exists(c,
    c.type == "Ready" && c.status == "True"
    && has(c.observedGeneration) && c.observedGeneration == metadata.generation)
properties:
  - id: P1
    description: A Ready Certificate's Secret exists.
    cel: >-
      !has(status.conditions)
      || !status.conditions.exists(c, c.type == "Ready" && c.status == "True")
      || managed.exists(o, o.kind == "Secret" && o.metadata.name == spec.secretName)
    when: checkpoint
# No webhook runs, so only paths whose valid values the overlay can state are
# mutated (DESIGN.md §8.3). The CRD schema constrains none of these: it takes
# any string as a duration or a DNS name, and would let renewBefore exceed
# duration, so renewBefore is not mutated at all.
generate:
  mutate:
    - spec.dnsNames
    - spec.duration
    - spec.privateKey.algorithm
    - spec.privateKey.rotationPolicy
  overlay:
    spec.dnsNames: {minItems: 1, maxItems: 3, items: {pattern: "^[a-z0-9-]{1,32}\\.example\\.test$"}}
    spec.duration: {enum: ["1h", "24h", "2160h"]}
launch:
  binary: bin/cert-manager-controller
  args:
    - --kubeconfig=$KUBECONFIG
    - --leader-elect=false
    - --enable-certificate-owner-ref=true
    # The metrics server takes an ephemeral port. The healthz server binds
    # 0.0.0.0:9403, and the only flag that moves it is hidden and upstream
    # discourages overriding it, so runs against this target are sequential.
    - --metrics-listen-address=127.0.0.1:0
