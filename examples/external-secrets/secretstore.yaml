# The fixture: an ExternalSecret reads from a SecretStore, and no CRD schema
# can invent a valid secretStoreRef (DESIGN.md §8.1). The fake provider serves
# two keys, so a sequence can switch remoteRef.key.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: fake
spec:
  provider:
    fake:
      data:
        - key: /token
          value: s3cr3t
        - key: /other
          value: other-value
