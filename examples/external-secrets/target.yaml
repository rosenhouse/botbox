# external-secrets as a black-box target (DESIGN.md §8.1). Nothing here is
# patched into external-secrets: the CRDs are its release asset and the binary
# is built from its own repository root, both at the version the Makefile pins.
name: external-secrets
version: v2.11.0
crds:
  - crds/external-secrets.yaml
primary: external-secrets.io/v1/ExternalSecret
sample: externalsecret.yaml
fixtures:
  - secretstore.yaml
# The controller also writes Events into the run namespace and leaves them
# there, so naming v1/Event here would fail G3, and G5 after any restart.
manages:
  - v1/Secret
# An ExternalSecret carries no observedGeneration. status.syncedResourceVersion
# is "<generation>-<hash of labels and annotations>", so its prefix is what
# proves the controller saw this generation (DESIGN.md §8.4).
ready: >-
  has(status.syncedResourceVersion)
  && status.syncedResourceVersion.startsWith(string(metadata.generation) + "-")
  && has(status.conditions) && status.conditions.exists(c,
    c.type == "Ready" && c.status == "True")
properties:
  - id: P1
    description: A Ready ExternalSecret's target Secret exists.
    cel: >-
      !has(status.conditions)
      || !status.conditions.exists(c, c.type == "Ready" && c.status == "True")
      || managed.exists(o, o.kind == "Secret" && o.metadata.name ==
        (has(spec.target) && has(spec.target.name) ? spec.target.name : metadata.name))
    when: checkpoint
# No webhook runs, so only paths whose valid values the overlay can state are
# mutated (DESIGN.md §8.3). spec.data is not mutated: its optional enums draw
# specs the fake provider rejects. creationPolicy and deletionPolicy are not
# mutated either, because Orphan is the negative control.
generate:
  mutate:
    - spec.target.name
    - spec.refreshInterval
  overlay:
    spec.target.name: {pattern: "^example-secret-[a-z0-9]{1,8}$"}
    spec.refreshInterval: {enum: ["1h0m0s", "24h0m0s"]}
launch:
  binary: bin/external-secrets
  args:
    # There is no --kubeconfig flag. The controller reads $KUBECONFIG, which the
    # launcher exports (DESIGN.md §5.1), and rejects the flag as unknown.
    #
    # Both servers take an ephemeral port, so runs against this target may
    # overlap.
    - --metrics-addr=127.0.0.1:0
    - --live-addr=127.0.0.1:0
    # The SecretStore fixture is re-validated on this interval, and each
    # validation writes. Longer than a run keeps it out of the quiet window.
    - --store-requeue-interval=1h
