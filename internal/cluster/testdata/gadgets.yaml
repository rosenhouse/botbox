# Gadgets are served at v1alpha1 and v1, and stored at v1.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.test.reconciler-fuzzer
spec:
  group: test.reconciler-fuzzer
  names:
    kind: Gadget
    plural: gadgets
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: false
      schema:
        openAPIV3Schema:
          type: object
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
