# The toy, with fixtures generation may change. Nothing launches this target.
name: fixtures
crds:
  - ../../../../targets/toy-widget/crds/
primary: toy.botbox/v1/Widget
sample: ../../../../targets/toy-widget/widget.yaml
fixtures:
  - config.yaml
  - token.yaml
  - bundle.yaml
manages:
  - v1/ConfigMap
generate:
  fixtures:
    config.yaml:
      mutate:
        - data.label
        - data["app.properties"]
    token.yaml:
      mutate:
        - data.token
    bundle.yaml: {}
launch:
  binary: bin/none
