# The cluster `make test-kind` runs the toy against. Both patches only relax
# checks, so a cgroup v2 host with full capabilities, such as a GitHub-hosted
# runner, does not need them.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# kubelet refuses a cgroup v1 host by default.
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    failCgroupV1: false
# runc cannot lower oom_score_adj without CAP_SYS_RESOURCE.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri"]
      restrict_oom_score_adj = true
