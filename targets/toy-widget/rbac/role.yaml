apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: toy-widget
rules:
  - apiGroups: ["toy.botbox"]
    resources: ["widgets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["toy.botbox"]
    resources: ["widgets/status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: toy-widget
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
